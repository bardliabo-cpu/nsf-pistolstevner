name: Oppdater NSF pistolstevner

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: nsf-pistolstevner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Hent ferske NSF-data til midlertidig fil
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 90 \
            "https://nsf-pistolstevner.bard-liabo.workers.dev/" \
            -o incoming.json

      - name: Valider, sammenlign og generer filer
        run: python scripts/build.py

      - name: Lagre nye data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions.json current.json changes.json index.html
          if git diff --cached --quiet; then
            echo "Ingen filendringer."
          else
            git commit -m "Oppdater NSF pistolstevner"
            git push
          fi

      - name: Opprett GitHub issue når stevner er endret
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(cat has_changes.txt)" -gt 0 ]; then
            gh issue create \
              --title "NSF pistolstevner: $(cat has_changes.txt) endring(er) $(date -u +%Y-%m-%d)" \
              --body-file issue.md
          else
            echo "Ingen nye eller endrede kommende stevner."
          fi
